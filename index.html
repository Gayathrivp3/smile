<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date Picker</title>
  <style>
    body {
      margin: 0;
      font-family: 'Times New Roman', Times, serif;
      font-weight: bold;
      background: linear-gradient(rgba(255, 192, 203, 0.4), rgba(255, 182, 193, 0.4)),
                  url('oct.webp') center/cover no-repeat; /* 💖 Replace with your photo name */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      transition: background 1s ease;
    }

    .container {
      text-align: center;
      background: rgba(255,255,255,0.3);
      padding: 30px 40px;
      border-radius: 15px;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
      animation: fadeIn 2s ease forwards;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.9);}
      to {opacity: 1; transform: scale(1);}
    }

    h1 {
      font-size: 2.2rem;
      color: #4a0e0e;
      text-shadow: 0 0 10px #ff6f61, 0 0 20px #ffe066;
      margin-bottom: 20px;
    }

    input, button {
      padding: 10px;
      margin-top: 15px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }

    input {
      background: white;
      color: #4a0e0e;
      font-weight: bold;
    }

    button {
      background: #ff6f61;
      color: white;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px #ffe066;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pick Today’s Date 📅🪄</h1>
    <input type="date" id="dateInput">
    <button onclick="checkDate()">Submit</button>
  </div>

  <script>
    function checkDate() {
      const inputDate = document.getElementById('dateInput').value;
      const today = new Date().toISOString().split('T')[0];

      if (inputDate === today) {
        document.body.style.opacity = "0"; // smooth fade-out
        setTimeout(() => window.location.href = "birthday.html", 1000);
      } else {
        alert("Oops! Please pick today's date 🎯");
      }
    }
  </script>
</body>
</html>
